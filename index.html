<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medic 1 Patient Follow-Up</title>
<style>
:root{--field:#0E3B33;--gold:#BF9E4C;--light:#CBDDD7}
body{margin:0;background:var(--field);color:#fff;
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;text-align:center;padding:20px;box-sizing:border-box}
h1{font-size:24px;margin:0}
.rule{width:120px;border-top:2px solid var(--gold);margin:16px auto 8px}
p{color:var(--light);font-size:14px;max-width:480px;margin:0 0 30px}
a.btn{display:block;width:100%;max-width:340px;margin:0 0 14px;padding:16px;
  border-radius:10px;text-decoration:none;font-weight:700;font-size:17px;
  background:#fff;color:var(--field)}
a.btn.alt{background:none;color:#fff;border:2px solid var(--gold)}
</style>
</head>
<body>
<h1>Medic 1 Ambulance<br>Patient Follow-Up</h1>
<div class="rule"></div>
<p>Request follow-up on a patient you cared for, or review previously completed follow-ups.</p>
<a class="btn" href="request/">Submit a follow-up request</a>
<a class="btn alt" href="results/">View previous follow-ups</a>
</body>
</html>
