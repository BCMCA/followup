<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Completed Follow-Ups</title>
<style>
:root{--field:#0E3B33;--gold:#BF9E4C;--light:#CBDDD7;--line:#2A554C}
body{margin:0;background:var(--field);color:#fff;
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:26px 16px 0;text-align:center}
h1{font-size:20px;margin:0}
.rule{width:100px;border-top:2px solid var(--gold);margin:12px auto}
main{max-width:640px;margin:0 auto;padding:6px 14px 50px}
input{width:100%;box-sizing:border-box;padding:12px 14px;font-size:16px;border:0;
  border-radius:8px;margin:8px 0 14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--gold);text-transform:uppercase;
  letter-spacing:.05em;padding:6px 8px;border-bottom:2px solid var(--gold)}
td{padding:0;border-bottom:1px solid var(--line)}
td a{display:block;padding:13px 8px;color:#fff;text-decoration:none}
tr:active{background:#154439}
.num{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--gold)}
.empty{color:var(--light);text-align:center;padding:40px 10px}
a.back{color:var(--light);font-size:14px;display:inline-block;margin:14px}
</style>
</head>
<body>
<header>
  <h1>Completed Follow-Ups</h1>
  <div class="rule"></div>
</header>
<main>
  <input id="q" type="search" placeholder="Filter by number, complaint, age"
    autocomplete="off" aria-label="Filter follow-ups">
  <table>
    <thead><tr><th>#</th><th>Complaint</th><th>Pt</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No follow-ups posted yet.</div>
  <div style="text-align:center"><a class="back" href="../">Back</a></div>
</main>
<script>
let DATA=[];
function render(){
  const t=(document.getElementById('q').value||'').toLowerCase();
  const rows=DATA.filter(f=>!t||(f.n+' '+f.c+' '+f.p).toLowerCase().includes(t));
  const tb=document.getElementById('rows');
  tb.innerHTML=rows.map(f=>
    `<tr><td><a class="num" href="../pdfs/${f.n}.pdf">${f.n}</a></td>`+
    `<td><a href="../pdfs/${f.n}.pdf">${f.c}</a></td>`+
    `<td><a href="../pdfs/${f.n}.pdf">${f.p}</a></td></tr>`).join('');
  document.getElementById('empty').style.display=rows.length?'none':'block';
}
fetch('../followups.json').then(r=>r.json()).then(j=>{
  DATA=j.sort((a,b)=>b.n.localeCompare(a.n));render();
}).catch(()=>{document.getElementById('empty').style.display='block';});
document.getElementById('q').addEventListener('input',render);
</script>
</body>
</html>
